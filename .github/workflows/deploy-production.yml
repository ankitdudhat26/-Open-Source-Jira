name: Deploy Production

# Builds every Plane image, pushes it to GitHub Container Registry (ghcr.io),
# then deploys it to the production server over SSH with deployments/production/deploy.sh.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST         server hostname or IP
#   SSH_USER         SSH user that can run docker
#   SSH_PRIVATE_KEY  private key for that user (the public key goes in ~/.ssh/authorized_keys)
# Optional repository secret:
#   SSH_KNOWN_HOSTS  output of `ssh-keyscan -p <port> <host>`, to pin the server's host key
# Optional repository variables:
#   SSH_PORT         default 22
#   DEPLOY_PATH      directory on the server holding plane.env, default /opt/plane
#
# See deployments/production/README.md for the full setup.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy an existing image tag (e.g. a previous commit SHA) without rebuilding. Leave empty to build the selected branch."
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      build: ${{ steps.vars.outputs.build }}
    steps:
      - id: vars
        env:
          OWNER: ${{ github.repository_owner }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          echo "image_prefix=${REGISTRY}/${OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ]; then
            echo "image_tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image }}
    needs: setup
    if: needs.setup.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: plane-frontend
            context: .
            dockerfile: 1-main/frontend/Dockerfile.web
          - image: plane-admin
            context: .
            dockerfile: 2-admin/admin/Dockerfile.admin
          - image: plane-space
            context: .
            dockerfile: 1-main/space/Dockerfile.space
          - image: plane-live
            context: .
            dockerfile: 1-main/live/Dockerfile.live
          - image: plane-backend
            context: 1-main/backend
            dockerfile: 1-main/backend/Dockerfile.api
          - image: plane-proxy
            context: 1-main/proxy
            dockerfile: 1-main/proxy/Dockerfile.ce
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.setup.outputs.image_prefix }}/${{ matrix.image }}:${{ needs.setup.outputs.image_tag }}
            ${{ needs.setup.outputs.image_prefix }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy to server
    needs: [setup, build]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/plane' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: deployments/production

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Set the SSH_HOST, SSH_USER and SSH_PRIVATE_KEY repository secrets."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer the pinned host key (SSH_KNOWN_HOSTS secret); fall back to scanning the server.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Upload deployment files
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            deployments/production/docker-compose.yml \
            deployments/production/deploy.sh \
            deployments/production/plane.env.example \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Deploy
        env:
          IMAGE_PREFIX: ${{ needs.setup.outputs.image_prefix }}
          APP_RELEASE: ${{ needs.setup.outputs.image_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The registry token is sent on stdin so it never appears in the remote process list.
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && chmod +x deploy.sh && \
             REGISTRY_TOKEN=\"\$(cat)\" IMAGE_PREFIX='$IMAGE_PREFIX' APP_RELEASE='$APP_RELEASE' \
             REGISTRY_USER='$REGISTRY_USER' ./deploy.sh"

      - name: Summary
        run: |
          echo "### Deployed \`${{ needs.setup.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Images: \`${{ needs.setup.outputs.image_prefix }}/plane-*:${{ needs.setup.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
